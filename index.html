<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>黄小侠：天之回廊</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#0f0e17;overflow:hidden;font-family:"KaiTi","STKaiti",serif;
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  #wrap{position:fixed;inset:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;background:#0f0e17}
  #ui{position:absolute;top:calc(10px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left));
    right:calc(12px + env(safe-area-inset-right));display:flex;justify-content:space-between;
    color:#e8d5a8;font-size:clamp(12px,2.6vh,18px);text-shadow:2px 2px 0 #000;pointer-events:none;z-index:5;letter-spacing:2px}
  #roomLabel{position:absolute;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
    color:#c9a96e;font-size:clamp(12px,2.6vh,18px);text-shadow:2px 2px 0 #000;z-index:5;pointer-events:none;letter-spacing:3px}
  #hint{position:absolute;bottom:calc(8px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;
    color:#7a6f5a;font-size:clamp(10px,2vh,13px);text-shadow:1px 1px 0 #000;pointer-events:none;z-index:5}
  .overlay{position:absolute;inset:0;background:rgba(15,14,23,0.95);display:flex;flex-direction:column;
    align-items:center;justify-content:center;color:#e8d5a8;z-index:10;padding:24px;text-align:center;overflow:auto}
  .overlay h1{font-size:clamp(24px,6vh,40px);margin-bottom:10px;color:#d4af37;text-shadow:3px 3px 0 #000;letter-spacing:6px}
  .overlay p{font-size:clamp(12px,2.4vh,15px);margin:5px 0;color:#a89878;line-height:1.7;max-width:560px}
  .cards{display:flex;gap:12px;margin:16px 0;flex-wrap:wrap;justify-content:center;max-width:96%}
  .card{width:clamp(120px,20vw,180px);background:#1f1d2e;border:2px solid #8b7355;border-radius:3px;padding:12px;
    cursor:pointer;transition:transform .1s;color:#e8d5a8}
  .card:hover,.card:active{transform:translateY(-4px);border-color:#d4af37;background:#2a2740}
  .card h3{font-size:clamp(13px,2.6vh,17px);margin-bottom:6px;color:#d4af37;letter-spacing:2px}
  .card .elem{font-size:clamp(9px,1.8vh,12px);margin-bottom:5px}
  .card .desc{font-size:clamp(10px,2vh,12px);line-height:1.5;color:#c8b890}
  .btn{margin-top:14px;padding:10px 30px;background:#5a4a2a;color:#e8d5a8;border:1px solid #8b7355;
    font-family:inherit;font-size:clamp(14px,3vh,18px);cursor:pointer;border-radius:3px;letter-spacing:4px}
  .btn:hover{background:#8b7355}
  .hidden{display:none!important}
  .ef{font-weight:bold}
  .rot{width:74px;height:74px;margin:6px 0 16px;animation:spin 1.6s ease-in-out infinite}
  @keyframes spin{0%,40%{transform:rotate(0)}70%,100%{transform:rotate(90deg)}}
  .linkbtn{margin-top:18px;color:#a89878;font-size:13px;text-decoration:underline;background:none;border:none;
    font-family:inherit;cursor:pointer}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="ui">
    <span id="hp">气血 100/100</span>
    <span id="dmgMul">伤害 x1.0</span>
    <span id="room">第一回</span>
  </div>
  <div id="roomLabel"></div>
  <div id="hint">左手按住拖动移动 · 右手按住拖动瞄准（松手自动锁定最近敌人）· 剑自动挥</div>

  <div class="overlay hidden" id="rotateTip" style="z-index:20">
    <svg class="rot" viewBox="0 0 24 24" fill="none" stroke="#d4af37" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="7" y="2.5" width="10" height="19" rx="2"/>
      <line x1="12" y1="18" x2="12" y2="18.2"/>
    </svg>
    <h1 style="font-size:clamp(18px,4vh,26px)">请横屏握持手机</h1>
    <p>横屏视野开阔，双摇杆操作更顺手</p>
    <button class="linkbtn" id="continuePortrait">继续竖屏游玩</button>
  </div>

  <div class="overlay" id="menu">
    <h1>黄小侠</h1>
    <p style="color:#d4af37;letter-spacing:4px">— 天 之 回 廊 —</p>
    <p>黄小侠仗剑独行，误入妖魔盘踞的古回廊。每过一间武场，习得一门剑意。以剑气化劲，破妖邪之法。</p>
    <p style="margin-top:12px;color:#c8b890">— 择一入门剑意 —</p>
    <div class="cards" id="startCards"></div>
  </div>

  <div class="overlay hidden" id="choose">
    <h1 id="chooseTitle" style="font-size:clamp(18px,4vh,26px)">习得剑意</h1>
    <div class="cards" id="chooseCards"></div>
  </div>

  <div class="overlay hidden" id="end">
    <h1 id="endTitle">通关</h1>
    <p id="endText"></p>
    <button class="btn" id="restartBtn">再 入 回 廊</button>
  </div>
</div>

function rand(a, b) { return a + Math.random() * (b - a); }

// map continuous angle to 4 dirs (0=down,1=left,2=up,3=right)
function angleToFace(ang) {
  let a = ang;
  while (a < 0) a += Math.PI * 2;
  if (a < Math.PI / 4 || a >= Math.PI * 7 / 4) return 3;
  if (a < Math.PI * 3 / 4) return 0;
  if (a < Math.PI * 5 / 4) return 1;
  return 2;
}

  // move: left half; aim: right half
  let moveTouch = null;  // {id, cx, cy, dx, dy}
  let aimTouch = null;   // {id, cx, cy, dx, dy}
  const JOY_R = 22; // joystick max radius in world units

  const PATTERNS = {};
  let WALK_WHITE = null, BOSS_WHITE = null;
  const SKILL_INFO = {};

  function cb() { return callbacks; }

  // ---- offscreen canvas helper ----
  function makeOff(w, h) {
    const c = makeOffscreenWeb(w, h);
    return c;
  }

  // ---- resize to css pixels ----
  function resize(cssW, cssH) {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    scale = cssW / worldW;
    worldH = worldW * (cssH / cssW);
    CFG.H = worldH;
    return { dpr, scale };
  }

  function applyBaseTransform(dpr) {
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
  }

  // ================= PLAYER / RUN =================
  function newRun(startStyle) {
    player = {
      x: worldW / 2, y: worldH / 2,
      hp: 100, maxhp: 100,
      size: CFG.player.size,
      speed: CFG.player.speed,
      shield: 0,
      style: startStyle,
      buffs: [],
      atkCd: 0,
      iframes: 0,
      swingT: 0,
      walkT: 0,
      face: 0,
      moving: false,
      dmgMul: 1.0
    };
    enemies = []; slashes = []; qiqis = []; enemyProjs = []; particles = [];
    shockwaves = []; dmgNumbers = []; pickups = [];
    roomNum = 1; roomCleared = false; shakeT = 0; time = 0; hurtFlash = 0;
    startRoom();
    state = 'room';
    cb().onRoomStart();
  }

  function hasBuff(b) { return player.buffs.includes(b); }

  function startRoom() {
    roomCleared = false;
    lastTheme = ROOM_THEMES[roomNum - 1];
    player.hp = Math.min(player.maxhp, player.hp + player.maxhp * CFG.regenOnRoom);
    const e = [];
    // Clamp spawn into the visible area; wide landscape screens have a smaller
    // world height, so spawn on an ellipse rather than a circle.
    const cx = worldW / 2, cy = worldH / 2;
    const clampX = (v) => Math.max(34, Math.min(worldW - 34, v));
    const clampY = (v) => Math.max(34, Math.min(worldH - 34, v));
    const ringSpawn = (type, n) => {
      for (let i = 0; i < n; i++) {
        const ang = (i / n) * Math.PI * 2 + rand(0, 0.5);
        const r = rand(100, 145);
        const rx = r;
        const ry = r * Math.min(1, (worldH - 70) / (worldW - 70));
        e.push(makeEnemy(type, clampX(cx + Math.cos(ang) * rx), clampY(cy + Math.sin(ang) * ry)));
      }
    };
    if (roomNum === 1) {
      ringSpawn('bandit', 6);
      e.push(makeEnemy('archer', rand(50, worldW - 50), rand(30, worldH - 30)));
    } else if (roomNum === 2) {
      ringSpawn('bandit', 5);
      e.push(makeEnemy('archer', rand(40, worldW - 40), rand(30, worldH - 30)));
      e.push(makeEnemy('archer', rand(40, worldW - 40), rand(30, worldH - 30)));
      e.push(makeEnemy('shield', worldW / 2, 40));
    } else if (roomNum === 3) {
      ringSpawn('assassin', 6);
      e.push(makeEnemy('mage', rand(40, worldW - 40), rand(30, worldH - 30)));
      e.push(makeEnemy('mage', rand(40, worldW - 40), rand(30, worldH - 30)));
    } else if (roomNum === 4) {
      ringSpawn('bandit', 4);
      ringSpawn('assassin', 3);
      e.push(makeEnemy('shield', rand(60, worldW - 60), rand(40, worldH - 40)));
      e.push(makeEnemy('shield', rand(60, worldW - 60), rand(40, worldH - 40)));
      e.push(makeEnemy('archer', rand(40, worldW - 40), rand(30, worldH - 30)));
      e.push(makeEnemy('archer', rand(40, worldW - 40), rand(30, worldH - 30)));
    } else if (roomNum === 5) {
      e.push(makeEnemy('elite', worldW / 2, 50));
      e.push(makeEnemy('mage', rand(40, worldW - 40), rand(30, worldH - 30)));
      e.push(makeEnemy('mage', rand(40, worldW - 40), rand(30, worldH - 30)));
      ringSpawn('bandit', 4);
    } else {
      e.push(makeEnemy('boss', worldW / 2, 50));
    }
    enemies = e;
    cb().onRoom({ roomText: ROOM_NUM_TEXT[roomNum - 1], roomLabel: lastTheme.name });
  }

  function startBossSkill(en, skill, dur) {
    en.bossSkill = skill; en.bossSkillT = 0; en.bossSkillDur = dur;
    en.skillHit = false;
    en.bossSkillAng = Math.atan2(player.y - en.y, player.x - en.x);
    en.atkT = dur;
  }

  // ================= ENEMY =================
  function makeEnemy(type, x, y) {
    const base = {
      bandit: { hp: 30, spd: 0.8, dmg: 8, size: 5, color: '#8b5a2b', cloth: '#6b4423', ranged: false },
      assassin: { hp: 26, spd: 1.25, dmg: 8, size: 5, color: '#5a2a2a', cloth: '#222226', ranged: false },
      shield: { hp: 75, spd: 0.45, dmg: 10, size: 7, color: '#7a7a82', cloth: '#4a4a52', ranged: false },
      mage: { hp: 24, spd: 0.55, dmg: 8, size: 5, color: '#6a5a3a', cloth: '#3a3326', ranged: true },
      archer: { hp: 20, spd: 0.5, dmg: 6, size: 4, color: '#7b8b5a', cloth: '#4a5a3a', ranged: true },
      elite: { hp: 270, spd: 0.6, dmg: 18, size: 10, color: '#c0392b', cloth: '#922b21', ranged: false },
      boss: { hp: 650, spd: 0.55, dmg: 12, size: 14, color: '#d4af37', cloth: '#7d6608', ranged: false }
    }[type];
    return {
      id: ++enemyIdCounter,
      type, x, y,
      hp: base.hp * (1 + (roomNum - 1) * 0.12), maxhp: base.hp * (1 + (roomNum - 1) * 0.12),
      spd: base.spd, dmg: base.dmg, size: base.size, color: base.color, cloth: base.cloth,
      ranged: base.ranged,
      scale: type === 'elite' ? 1.5 : 1,
      fireT: 0, waterT: 0, thunderT: 0, windT: 0,
      reactCd: 0, flash: 0, wobble: Math.random() * 10,
      atkCd: rand(0.8, 1.6),
      atkT: 0,
      walkT: Math.random() * 10,
      moving: false,
      face: 0,
      dashCd: rand(1.5, 3),
      spinCd: rand(3, 5),
      spinT: 0,
      chargeCd: type === 'boss' ? 3 : 0,
      charging: 0,
      skillCd: rand(2, 4),
      bossSkill: null, bossSkillT: 0, bossSkillDur: 0, bossSkillAng: 0,
      facing: 0,
      bodyFacing: Math.random() * Math.PI * 2
    };
  }

  // ================= DAMAGE / HIT =================
  function damagePlayer(dmg) {
    if (player.god || player.iframes > 0) return;
    let real = dmg;
    if (player.shield > 0) {
      const ab = Math.min(player.shield, real);
      player.shield -= ab; real -= ab;
    }
    player.hp -= real;
    player.iframes = CFG.player.iframes;
    shakeT = 0.25;
    hurtFlash = 0.3;
    dmgNumbers.push({ x: player.x + rand(-3, 3), y: player.y - 10, val: Math.round(real), life: 0.8, vy: -1.2 });
    for (let i = 0; i < 6; i++) particles.push({ x: player.x, y: player.y, vx: rand(-1.5, 1.5), vy: rand(-1.5, 1.5), life: 0.3, color: '#ff004d', size: 2 });
  }

  function doSlash() {
    const style = SKILLS[player.style];
    let range = CFG.player.swordRange;
    if (hasBuff('wind_range')) range *= 1.4;
    const ang = mouseAngle;
    player.swingT = 0.18;
    slashes.push({ x: player.x, y: player.y, ang, life: 0.15, range, elem: style.elem });

    enemies.forEach(en => {
      const dx = en.x - player.x, dy = en.y - player.y;
      const d = Math.hypot(dx, dy);
      if (d < range + en.size) {
        const ea = Math.atan2(dy, dx);
        let da = Math.abs(ea - ang);
        if (da > Math.PI) da = Math.PI * 2 - da;
        if (da < CFG.player.swordArc) {
          applyHit(en, style.elem, style.dmg * player.dmgMul, ea);
        }
      }
    });

    if (hasBuff('swordqi')) {
      const qiDmg = style.dmg * player.dmgMul;
      const qiCount = hasBuff('thunder_extra') ? 2 : 1;
      for (let q = 0; q < qiCount; q++) {
        const spread = qiCount === 2 ? (q === 0 ? -0.12 : 0.12) : 0;
        const a = ang + spread;
        qiqis.push({ x: player.x + Math.cos(a) * 8, y: player.y + Math.sin(a) * 8, vx: Math.cos(a) * 3.5, vy: Math.sin(a) * 3.5, dmg: qiDmg, elem: style.elem, life: 1.2, hitCd: 0, pierce: true });
      }
    }
  }

  function applyHit(en, elem, dmg, attackDir) {
    if (en.type === 'shield' && attackDir != null) {
      let bd = attackDir - en.bodyFacing;
      while (bd > Math.PI) bd -= Math.PI * 2;
      while (bd < -Math.PI) bd += Math.PI * 2;
      if (Math.abs(bd) < 0.9) {
        dmg *= 0.3;
        for (let i = 0; i < 3; i++) particles.push({ x: en.x + Math.cos(en.bodyFacing) * 8, y: en.y + Math.sin(en.bodyFacing) * 8, vx: rand(-.5, .5), vy: rand(-.5, .5), life: 0.2, color: '#cfd8dc', size: 1 });
      }
    }
    en.flash = 0.08;
    en.hp -= dmg;
    if (elem === 'fire') en.fireT = 2;
    if (elem === 'water') en.waterT = 2;
    if (elem === 'thunder') {
      en.thunderT = 2;
      if (en.fireT > 0 && hasBuff('overload')) {
        dmg *= 1.8;
        enemies.forEach(o => {
          if (o !== en && o.hp > 0 && o.fireT > 0 && Math.hypot(o.x - en.x, o.y - en.y) < 60) {
            o.hp -= dmg * 0.7;
            for (let j = 0; j < 3; j++) particles.push({ x: en.x, y: en.y, vx: (o.x - en.x) / 3, vy: (o.y - en.y) / 3, life: 0.1, color: '#f4d03f', size: 2 });
          }
        });
      }
      // small thunder chain
      const chainN = hasBuff('thunder_extra') ? 2 : 1;
      let chained = 0;
      enemies.forEach(o => {
        if (chained >= chainN || o === en || o.hp <= 0) return;
        if (Math.hypot(o.x - en.x, o.y - en.y) < 70) {
          o.hp -= dmg * 0.5; o.flash = 0.08; chained++;
          for (let j = 0; j < 3; j++) particles.push({ x: en.x, y: en.y, vx: (o.x - en.x) / 3, vy: (o.y - en.y) / 3, life: 0.12, color: '#f4d03f', size: 1 });
        }
      });
    }
    if (elem === 'wind') en.windT = 1;
    if (hasBuff('flame_dot') && elem !== 'fire') en.fireT = 2;
    if (hasBuff('ice_shield') && en.waterT > 0 && Math.random() < 0.3) player.shield = Math.min(8, player.shield + 1);
    for (let i = 0; i < 3; i++) particles.push({ x: en.x, y: en.y, vx: rand(-1, 1), vy: rand(-1, 1), life: 0.15, color: ELEM_COLOR[elem], size: 1 });
  }

  // ================= UPDATE =================
  function update(dt) {
    time += dt;
    if (state !== 'room') return;

    // ---- player movement from left joystick ----
    let mx = 0, my = 0;
    if (moveTouch) {
      mx = moveTouch.dx; my = moveTouch.dy;
    }
    const ml = Math.hypot(mx, my);
    player.moving = ml > 0.05;
    if (ml > 1) { mx /= ml; my /= ml; }
    if (player.moving) {
      player.x += mx * player.speed;
      player.y += my * player.speed;
      player.walkT += dt;
    }
    player.x = Math.max(8, Math.min(worldW - 8, player.x));
    player.y = Math.max(8, Math.min(worldH - 8, player.y));

    // ---- aim: right joystick, else auto-target nearest enemy ----
    if (aimTouch && (Math.hypot(aimTouch.dx, aimTouch.dy) > 0.1)) {
      mouseAngle = Math.atan2(aimTouch.dy, aimTouch.dx);
    } else {
      let nearest = null, nd = 999;
      enemies.forEach(e => {
        const dd = Math.hypot(e.x - player.x, e.y - player.y);
        if (dd < nd) { nd = dd; nearest = e; }
      });
      if (nearest) mouseAngle = Math.atan2(nearest.y - player.y, nearest.x - player.x);
    }
    player.face = angleToFace(mouseAngle);
    if (player.iframes > 0) player.iframes -= dt;
    if (player.swingT > 0) player.swingT -= dt;
    if (hurtFlash > 0) hurtFlash -= dt;

    let slowMul = 1;
    if (hasBuff('slow_aura')) slowMul = 0.7;

    // auto swing
    player.atkCd -= dt;
    if (player.atkCd <= 0) {
      doSlash();
      player.atkCd = player.style === 'sword_wind' ? 0.6 : 0.75;
    }

    // ---- qiqis ----
    qiqis.forEach(q => {
      q.x += q.vx * dt * 60; q.y += q.vy * dt * 60; q.life -= dt;
      if (q.hitCd > 0) q.hitCd -= dt;
      enemies.forEach(en => {
        if (en.hp <= 0) return;
        if (q.hitIds && q.hitIds.includes(en.id)) return;
        if (Math.hypot(en.x - q.x, en.y - q.y) < en.size + 4) {
          applyHit(en, q.elem, q.dmg, Math.atan2(q.vy, q.vx));
          if (q.pierce) { q.hitIds = q.hitIds || []; q.hitIds.push(en.id); }
          else q.life = 0;
        }
      });
    });
    qiqis = qiqis.filter(q => q.life > 0 && q.x > -20 && q.x < worldW + 20 && q.y > -20 && q.y < worldH + 20);

    slashes.forEach(s => s.life -= dt);
    slashes = slashes.filter(s => s.life > 0);

    // ---- enemy projectiles ----
    enemyProjs.forEach(p => {
      p.x += p.vx * dt * 60; p.y += p.vy * dt * 60; p.life -= dt;
      if (Math.hypot(player.x - p.x, player.y - p.y) < player.size + 3 && player.iframes <= 0) {
        damagePlayer(p.dmg); p.life = 0;
      }
    });
    enemyProjs = enemyProjs.filter(p => p.life > 0 && p.x > -20 && p.x < worldW + 20 && p.y > -20 && p.y < worldH + 20);

    // ---- shockwaves ----
    shockwaves.forEach(sw => {
      sw.r += sw.spd * dt * 60; sw.life -= dt;
      const dd = Math.hypot(player.x - sw.x, player.y - sw.y);
      if (dd < sw.r + player.size && dd > sw.r - 6 && player.iframes <= 0) damagePlayer(sw.dmg);
    });
    shockwaves = shockwaves.filter(sw => sw.life > 0 && sw.r < sw.maxr);

    // ================= ENEMIES =================
    enemies.forEach(en => {
      if (en.hp <= 0) return;
      if (en.flash > 0) en.flash -= dt;
      if (en.reactCd > 0) en.reactCd -= dt;
      if (en.fireT > 0) en.fireT -= dt;
      if (en.waterT > 0) en.waterT -= dt;
      if (en.thunderT > 0) en.thunderT -= dt;
      if (en.windT > 0) en.windT -= dt;
      if (en.spinT > 0) en.spinT -= dt;

      if (en.fireT > 0) {
        let dot = 8;
        if (hasBuff('flame_boost')) dot *= 1.6;
        en.hp -= dot * dt;
      }

      const dx = player.x - en.x, dy = player.y - en.y;
      const d = Math.hypot(dx, dy) || 1;
      en.facing = Math.atan2(dy, dx);
      if (en.type === 'shield') {
        let td = en.facing - en.bodyFacing;
        while (td > Math.PI) td -= Math.PI * 2;
        while (td < -Math.PI) td += Math.PI * 2;
        en.bodyFacing += Math.max(-2.0 * dt, Math.min(2.0 * dt, td));
        en.face = angleToFace(en.bodyFacing);
      } else {
        en.face = angleToFace(en.facing);
        en.bodyFacing = en.facing;
      }
      let spd = en.spd * slowMul;
      if (en.waterT > 0) spd *= 0.6;
      en.moving = false;
      if (en.atkT > 0) en.atkT -= dt;

      if (en.type === 'boss' && en.bossSkill) {
        en.bossSkillT += dt;
        const t = en.bossSkillT, dur = en.bossSkillDur, a = en.bossSkillAng;
        if (en.bossSkill === 'lantsi' && !en.skillHit && t > 0.35) {
          en.skillHit = true;
          for (let i = -3; i <= 3; i++) { const aa = a + i * 0.22;
            enemyProjs.push({ x: en.x, y: en.y, vx: Math.cos(aa) * 2.6, vy: Math.sin(aa) * 2.6, dmg: 10, size: 3, color: '#7fb8ff', kind: 'magic', life: 2.2 });
          }
          for (let i = 0; i < 8; i++) particles.push({ x: en.x, y: en.y, vx: rand(-1, 1), vy: rand(-1, 1), life: .3, color: '#7fb8ff', size: 1 });
        }
        if (en.bossSkill === 'shapo' && !en.skillHit && t > 0.5) {
          en.skillHit = true;
          enemyProjs.push({ x: en.x, y: en.y, vx: Math.cos(a) * 5, vy: Math.sin(a) * 5, dmg: 22, size: 6, color: '#7fb8ff', kind: 'wolf', life: 1.6 });
          for (let i = 0; i < 10; i++) particles.push({ x: en.x, y: en.y, vx: rand(-1.5, 1.5), vy: rand(-1.5, 1.5), life: .4, color: '#7fb8ff', size: 2 });
        }
        if (en.bossSkill === 'bawang' && !en.skillHit && t > 0.85) {
          en.skillHit = true;
          shockwaves.push({ x: en.x, y: en.y, r: 10, spd: 3.5, maxr: 75, life: 0.5, dmg: 20 });
          shakeT = Math.max(shakeT, 0.3);
          for (let i = 0; i < 16; i++) particles.push({ x: en.x, y: en.y, vx: rand(-2, 2), vy: rand(-2, 2), life: .5, color: '#7fb8ff', size: 2 });
        }
        if (t >= dur) { en.bossSkill = null; en.skillHit = false; en.skillCd = rand(2.5, 4); }
      } else if (en.charging > 0) {
        en.charging -= dt;
        en.x += (en.chargeX || dx / d) * 3 * dt * 60;
        en.y += (en.chargeY || dy / d) * 3 * dt * 60;
        en.moving = true; en.walkT += dt;
      } else if (en.spinT > 0) {
        en.x += dx / d * spd * 0.3 * dt * 60;
        en.y += dy / d * spd * 0.3 * dt * 60;
        en.moving = true; en.walkT += dt;
        if (Math.hypot(dx, dy) < 30 && player.iframes <= 0) damagePlayer(en.dmg * 0.8);
      } else {
        if (en.ranged) {
          const lo = en.type === 'mage' ? 100 : 80, hi = en.type === 'mage' ? 160 : 140;
          if (d < lo) { en.x -= dx / d * spd * dt * 60; en.y -= dy / d * spd * dt * 60; en.moving = true; }
          else if (d > hi) { en.x += dx / d * spd * dt * 60; en.y += dy / d * spd * dt * 60; en.moving = true; }
          if (en.moving) en.walkT += dt;
          en.atkCd -= dt;
          if (en.atkCd <= 0 && d < 210) {
            en.atkT = 0.3;
            if (en.type === 'mage') {
              enemyProjs.push({ x: en.x, y: en.y, vx: dx / d * 2.0, vy: dy / d * 2.0, dmg: en.dmg, size: 3, color: '#b39ddb', kind: 'magic', life: 2.6 });
              for (let i = 0; i < 4; i++) particles.push({ x: en.x, y: en.y, vx: rand(-.5, .5), vy: rand(-.5, .5), life: .3, color: '#b39ddb', size: 1 });
              en.atkCd = 2.4;
            } else {
              enemyProjs.push({ x: en.x, y: en.y, vx: dx / d * 3.2, vy: dy / d * 3.2, dmg: en.dmg, size: 2, color: '#f2e6cf', kind: 'arrow', life: 1.8 });
              en.atkCd = 2.0;
            }
          }
        } else {
          en.x += dx / d * spd * dt * 60;
          en.y += dy / d * spd * dt * 60;
          en.moving = true; en.walkT += dt;
        }

        if (en.type === 'assassin') {
          en.dashCd -= dt;
          if (en.dashCd <= 0 && d < 150) {
            en.charging = 0.4; en.chargeX = dx / d; en.chargeY = dy / d;
            for (let i = 0; i < 5; i++) particles.push({ x: en.x + dx / d * i * 8, y: en.y + dy / d * i * 8, vx: 0, vy: 0, life: 0.35, color: '#e74c3c', size: 1 });
            en.dashCd = 2.6;
          }
        }
        if (en.type === 'elite') {
          en.spinCd -= dt;
          if (en.spinCd <= 0) {
            en.spinT = 2;
            shockwaves.push({ x: en.x, y: en.y, r: 10, spd: 2, maxr: 35, life: 0.5, dmg: 15 });
            en.spinCd = 6;
          }
        }
        if (en.type === 'boss') {
          en.chargeCd -= dt;
          en.skillCd -= dt;
          en.atkCd -= dt;
          if (en.atkCd <= 0 && d < 120) {
            en.atkT = 0.4;
            const aa = Math.atan2(dy, dx);
            enemyProjs.push({ x: en.x, y: en.y, vx: Math.cos(aa) * 2.8, vy: Math.sin(aa) * 2.8, dmg: 11, size: 4, color: '#7fb8ff', kind: 'crescent', life: 2.0 });
            en.atkCd = 1.6;
          }
          if (en.skillCd <= 0 && !en.bossSkill) {
            en.skillSeq = (en.skillSeq || 0) + 1;
            // every 3rd cast is guaranteed to be 杀破狼 so all three skills appear;
            // otherwise distance decides the preference
            if (en.skillSeq % 3 === 0 || d > 150) startBossSkill(en, 'shapo', 1.0);
            else if (d < 75) startBossSkill(en, 'bawang', 1.4);
            else startBossSkill(en, 'lantsi', 0.8);
          }
          if (en.chargeCd <= 0 && d < 190 && !en.bossSkill) {
            en.charging = 0.7; en.chargeX = dx / d; en.chargeY = dy / d;
            for (let i = 0; i < 8; i++) particles.push({ x: en.x + dx / d * i * 8, y: en.y + dy / d * i * 8, vx: 0, vy: 0, life: 0.5, color: '#7fb8ff', size: 1 });
            en.chargeCd = 5;
          }
        }
      }

      // melee contact
      if (!en.ranged && Math.hypot(player.x - en.x, player.y - en.y) < en.size + player.size && player.iframes <= 0) {
        damagePlayer(en.dmg);
      }

      // steam reaction
      if (en.fireT > 0 && en.waterT > 0 && en.reactCd <= 0) {
        let r = 25;
        if (hasBuff('steam_boom')) r = 40;
        enemies.forEach(o => {
          if (o.hp > 0 && Math.hypot(o.x - en.x, o.y - en.y) < r + o.size) {
            o.hp -= 25; o.flash = 0.1;
          }
        });
        for (let i = 0; i < 10; i++) particles.push({ x: en.x, y: en.y, vx: rand(-1, 1), vy: rand(-1, 1), life: 0.4, color: '#bdc3c7', size: rand(1, 3) });
        en.fireT = 0; en.waterT = 0; en.reactCd = 0.5;
        shakeT = Math.max(shakeT, 0.1);
      }
    });

    // enemy separation
    enemies.forEach(en => {
      if (en.charging > 0) return;
      enemies.forEach(o => {
        if (o === en) return;
        const ddx = en.x - o.x, ddy = en.y - o.y;
        const dd = Math.hypot(ddx, ddy);
        const min = en.size + o.size + 4;
        if (dd < min && dd > 0.1) {
          en.x += ddx / dd * 0.6;
          en.y += ddy / dd * 0.6;
        }
      });
    });

    // keep enemies (incl. boss) inside the visible arena after movement/separation
    enemies.forEach(en => {
      en.x = Math.max(en.size, Math.min(worldW - en.size, en.x));
      en.y = Math.max(en.size, Math.min(worldH - en.size, en.y));
    });

    particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life -= dt; });
    particles = particles.filter(p => p.life > 0);
    dmgNumbers.forEach(d => { d.y += d.vy; d.vy *= 0.95; d.life -= dt; });
    dmgNumbers = dmgNumbers.filter(d => d.life > 0);

    enemies = enemies.filter(en => {
      if (en.hp <= 0) {
        for (let i = 0; i < 8; i++) particles.push({ x: en.x, y: en.y, vx: rand(-1.5, 1.5), vy: rand(-1.5, 1.5), life: 0.4, color: en.color, size: 2 });
        if (en.type === 'boss' || en.type === 'elite' || Math.random() < 0.12) {
          pickups.push({ x: en.x, y: en.y, type: 'hp', val: en.type === 'boss' ? 40 : en.type === 'elite' ? 30 : 15, life: 12, bob: Math.random() * 6 });
        }
        return false;
      }
      return true;
    });

    pickups.forEach(pk => {
      pk.bob += dt * 4; pk.life -= dt;
      if (Math.hypot(player.x - pk.x, player.y - pk.y) < player.size + 6) {
        if (pk.type === 'hp') {
          player.hp = Math.min(player.maxhp, player.hp + pk.val);
          for (let i = 0; i < 6; i++) particles.push({ x: player.x, y: player.y, vx: rand(-1, 1), vy: rand(-1, 1), life: 0.4, color: '#ff5f6d', size: 2 });
        }
        pk.life = 0;
      }
    });
    pickups = pickups.filter(pk => pk.life > 0);

    if (enemies.length === 0 && !roomCleared) {
      roomCleared = true;
      setTimeout(() => {
        if (roomNum >= CFG.rooms) { win(); }
        else {
          player.dmgMul *= (1 + CFG.roomDmgBoost);
          showChoose();
        }
      }, 500);
    }
    if (player.hp <= 0) lose();
    if (shakeT > 0) shakeT -= dt;

    cb().onHud({
      hpText: '气血 ' + Math.max(0, Math.ceil(player.hp)) + '/' + player.maxhp + (player.shield > 0 ? ' (甲' + Math.ceil(player.shield) + ')' : ''),
      dmgMulText: '伤害 x' + player.dmgMul.toFixed(1)
    });
  }

  // ================= CHOOSE / WIN / LOSE =================
  function showChoose() {
    state = 'choose';
    const pool = MID_POOL.filter(o => !player.buffs.includes(o) && o !== player.style);
    const opts = [];
    while (opts.length < 3 && pool.length) {
      const i = Math.floor(Math.random() * pool.length);
      opts.push(pool.splice(i, 1)[0]);
    }
    const pElems = [SKILLS[player.style].elem, ...player.buffs.map(b => SKILLS[b].elem)];
    if (!opts.some(o => pElems.includes(SKILLS[o].elem))) {
      const m = MID_POOL.filter(o => pElems.includes(SKILLS[o].elem) && !opts.includes(o));
      if (m.length) opts[2] = m[0];
    }
    if (!player.buffs.includes('swordqi') && roomNum <= 3 && !opts.includes('swordqi')) {
      opts[0] = 'swordqi';
    }
    const cards = opts.map(sk => {
      const d = SKILLS[sk];
      return { key: sk, name: d.name, elem: d.elem, desc: d.desc };
    });
    cb().onChoose({
      title: '第' + NUM_CN[roomNum - 1] + '回已破 · 伤害+10%',
      cards
    });
  }

  function pickChoose(key) {
    if (SKILLS[key].type === 'style') player.style = key;
    else if (!player.buffs.includes(key)) player.buffs.push(key);
    roomNum++; startRoom(); state = 'room';
    cb().onRoomStart();
  }

  function win() {
    state = 'end';
    const text = '黄小侠仗剑而出，妖魔散去。\n最终伤害倍率 x' + player.dmgMul.toFixed(1) +
      '\n习得剑意：' + SKILLS[player.style].name + ' / ' + player.buffs.map(b => SKILLS[b].name).join(' / ') +
      '\n用时 ' + Math.floor(time) + ' 秒';
    cb().onEnd({ title: '回廊已破！', text });
  }
  function lose() {
    state = 'end';
    const text = '行至第 ' + roomNum + ' 回 · 伤害倍率 x' + player.dmgMul.toFixed(1) +
      '\n剑意：' + SKILLS[player.style].name + ' / ' + player.buffs.map(b => SKILLS[b].name).join(' / ');
    cb().onEnd({ title: '倒 下 了', text });
  }

  // ================= TOUCH HANDLING =================
  function toWorldX(cssX) { return cssX / scale; }
  function toWorldY(cssY) { return cssY / scale; }

  function touchStart(touches) {
    touches.forEach(t => {
      const wx = toWorldX(t.x), wy = toWorldY(t.y);
      if (wx < worldW / 2) {
        if (!moveTouch) moveTouch = { id: t.identifier, cx: wx, cy: wy, dx: 0, dy: 0 };
      } else {
        if (!aimTouch) aimTouch = { id: t.identifier, cx: wx, cy: wy, dx: 0, dy: 0 };
      }
    });
  }
  function touchMove(touches) {
    touches.forEach(t => {
      const wx = toWorldX(t.x), wy = toWorldY(t.y);
      if (moveTouch && moveTouch.id === t.identifier) {
        let dx = wx - moveTouch.cx, dy = wy - moveTouch.cy;
        const dd = Math.hypot(dx, dy);
        if (dd > JOY_R) { dx = dx / dd * JOY_R; dy = dy / dd * JOY_R; }
        moveTouch.dx = dx / JOY_R; moveTouch.dy = dy / JOY_R;
      }
      if (aimTouch && aimTouch.id === t.identifier) {
        let dx = wx - aimTouch.cx, dy = wy - aimTouch.cy;
        const dd = Math.hypot(dx, dy);
        if (dd > JOY_R) { dx = dx / dd * JOY_R; dy = dy / dd * JOY_R; }
        aimTouch.dx = dx / JOY_R; aimTouch.dy = dy / JOY_R;
      }
    });
  }
  function touchEnd(touches) {
    touches.forEach(t => {
      if (moveTouch && moveTouch.id === t.identifier) moveTouch = null;
      if (aimTouch && aimTouch.id === t.identifier) aimTouch = null;
    });
  }

  // ================= RENDER =================
  function getPattern(tileKey) {
    if (PATTERNS[tileKey]) return PATTERNS[tileKey];
    const img = imgs[tileKey];
    if (img) {
      PATTERNS[tileKey] = ctx.createPattern(img, 'repeat');
      return PATTERNS[tileKey];
    }
    return null;
  }

  function makeWhiteSheet(img) {
    const c = makeOff(img.width, img.height);
    const cc = c.getContext('2d');
    cc.drawImage(img, 0, 0);
    const d = cc.getImageData(0, 0, img.width, img.height);
    for (let i = 0; i < d.data.length; i += 4) {
      if (d.data[i + 3] > 20) { d.data[i] = d.data[i + 1] = d.data[i + 2] = 255; }
    }
    cc.putImageData(d, 0, 0);
    return c;
  }
  function getWalkWhite() {
    if (WALK_WHITE) return WALK_WHITE;
    WALK_WHITE = makeWhiteSheet(imgs.walks);
    return WALK_WHITE;
  }
  function getBossWhite() {
    if (BOSS_WHITE) return BOSS_WHITE;
    BOSS_WHITE = makeWhiteSheet(imgs.boss);
    return BOSS_WHITE;
  }

  function drawGroundShadow(x, y, rx, ry, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha; ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 7); ctx.fill();
    ctx.restore();
  }

  function drawWalkFrame(key, en, alpha) {
    const row = CHAR_KEYS.indexOf(key);
    const col = en.face;
    const sc = key === 'hero' ? 1.12 : (en.scale || 1.0);
    const cw = WALK.cw * sc, ch = WALK.ch * sc;
    const bob = en.moving ? Math.abs(Math.sin(en.walkT * 12)) * 2.8 : 0;
    const shK = 1 - bob * 0.05;
    drawGroundShadow(en.x, en.y + 2, cw * 0.30 * shK, 3.5 * shK, 0.32 * (alpha == null ? 1 : alpha) * (1 - bob * 0.07));
    const sx = col * WALK.cw, sy = row * WALK.ch;
    const dx = en.x - cw / 2, dy = en.y - ch - bob;
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    if (alpha != null) ctx.globalAlpha = alpha;
    ctx.drawImage(imgs.walks, sx, sy, WALK.cw, WALK.ch, dx, dy, cw, ch);
    if (en.flash > 0) {
      const ww = getWalkWhite();
      if (ww) {
        ctx.globalAlpha = Math.min(0.95, en.flash / 0.08 * 0.95);
        ctx.drawImage(ww, sx, sy, WALK.cw, WALK.ch, dx, dy, cw, ch);
      }
    }
    ctx.restore();
  }

  function getSkillInfo(name) {
    if (SKILL_INFO[name]) return SKILL_INFO[name];
    const sheet = imgs[name];
    const n = name === 'bawang' ? 6 : 4;
    const c = makeOff(sheet.width, sheet.height);
    const cc = c.getContext('2d');
    cc.drawImage(sheet, 0, 0);
    const data = cc.getImageData(0, 0, sheet.width, sheet.height).data;
    const frames = [];
    for (let f = 0; f < n; f++) {
      let x0 = 9999, y0 = 9999, x1 = -1, y1 = -1;
      for (let y = 0; y < sheet.height; y++) {
        for (let x = f * SKILL.cw; x < (f + 1) * SKILL.cw; x++) {
          const k = (y * sheet.width + x) * 4;
          const lum = data[k] + data[k + 1] + data[k + 2];
          if (lum > 70) {
            if (x - f * SKILL.cw < x0) x0 = x - f * SKILL.cw;
            if (x - f * SKILL.cw > x1) x1 = x - f * SKILL.cw;
            if (y < y0) y0 = y; if (y > y1) y1 = y;
          }
        }
      }
      frames.push({ x0, x1, y0, y1 });
    }
    const bossH = BOSS.ch * 1.25;
    const scaleF = bossH / (frames[0].y1 - frames[0].y0);
    SKILL_INFO[name] = { frames, scale: scaleF };
    return SKILL_INFO[name];
  }

  function drawBoss(en) {
    const row = BOSS_ROW[en.face];
    let col;
    if (en.bossSkill) {
      const p = Math.min(1, en.bossSkillT / en.bossSkillDur);
      col = 4 + Math.min(5, Math.floor(p * 6));
    } else if (en.atkT > 0) {
      const p = 1 - Math.min(0.4, en.atkT) / 0.4;
      col = 4 + Math.min(5, Math.floor(p * 6));
    } else if (en.moving) {
      col = Math.floor(en.walkT * 7) % 4;
    } else col = 0;
    const sc = 1.25;
    const cw = BOSS.cw * sc, ch = BOSS.ch * sc;
    drawGroundShadow(en.x, en.y + 3, cw * 0.28, 4.5, 0.35);
    const sx = col * BOSS.cw, sy = row * BOSS.ch;
    const dx = en.x - cw / 2, dy = en.y - ch;
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(imgs.boss, sx, sy, BOSS.cw, BOSS.ch, dx, dy, cw, ch);
    if (en.flash > 0) {
      const bw2 = getBossWhite();
      if (bw2) {
        ctx.globalAlpha = Math.min(0.95, en.flash / 0.08 * 0.95);
        ctx.drawImage(bw2, sx, sy, BOSS.cw, BOSS.ch, dx, dy, cw, ch);
      }
    }
    ctx.restore();

    if (en.bossSkill) {
      const skill = en.bossSkill;
      const info = getSkillInfo(skill);
      if (info) {
        const n = skill === 'bawang' ? 6 : 4;
        const p = Math.min(1, en.bossSkillT / en.bossSkillDur);
        const fr = Math.min(n - 1, Math.floor(p * n));
        const fi = info.frames[fr];
        const s = info.scale;
        const sw = fi.x1 - fi.x0 + 1, sh = fi.y1 - fi.y0 + 1;
        const dw = sw * s, dh = sh * s;
        ctx.save();
        ctx.translate(en.x, en.y);
        if (skill !== 'bawang') ctx.scale(Math.cos(en.bossSkillAng) < 0 ? -1 : 1, 1);
        ctx.globalCompositeOperation = 'lighter';
        ctx.imageSmoothingEnabled = false;
        ctx.globalAlpha = 0.95;
        ctx.drawImage(imgs[skill], fr * SKILL.cw + fi.x0, fi.y0, sw, sh, -dw / 2, -dh, dw, dh);
        ctx.restore();
      }
    }
  }

  function drawEnemyProj(p) {
    const a = Math.atan2(p.vy, p.vx);
    if (p.kind === 'arrow') {
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(a);
      ctx.fillStyle = '#f2e6cf';
      ctx.fillRect(-6, -1, 12, 2);
      ctx.fillStyle = '#5a4a30';
      ctx.fillRect(-6, -2, 2, 4);
      ctx.restore();
      return;
    }
    const isWolf = p.kind === 'wolf';
    const r = isWolf ? 7 : p.size + 2;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.45;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, r * 1.8, 0, 7); ctx.fill();
    ctx.globalAlpha = 0.9;
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 7); ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(p.x, p.y, r * 0.4, 0, 7); ctx.fill();
    ctx.restore();
  }

  function drawJoystick(jt, color) {
    if (!jt) return;
    ctx.save();
    ctx.globalAlpha = 0.25;
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(jt.cx, jt.cy, JOY_R, 0, 7); ctx.stroke();
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(jt.cx + jt.dx * JOY_R, jt.cy + jt.dy * JOY_R, 7, 0, 7);
    ctx.fill();
    ctx.restore();
  }

  function render() {
    ctx.save();
    if (shakeT > 0) ctx.translate(rand(-2, 2), rand(-2, 2));
    const theme = lastTheme || ROOM_THEMES[0];

    const pat = getPattern(theme.tile);
    if (pat) {
      const rn = roomNum || 1;
      const ox = (rn * 73) % 384, oy = (rn * 131) % 384;
      ctx.save();
      ctx.translate(-ox, -oy);
      ctx.fillStyle = pat;
      ctx.fillRect(0, 0, worldW + 384, worldH + 384);
      ctx.restore();
    } else {
      ctx.fillStyle = '#1a1a22';
      ctx.fillRect(0, 0, worldW, worldH);
    }
    if (theme.dark) {
      ctx.fillStyle = 'rgba(6,3,10,0.5)';
      ctx.fillRect(0, 0, worldW, worldH);
    }

    if (state === 'menu' || state === 'end') { ctx.restore(); return; }

    particles.forEach(p => { ctx.fillStyle = p.color; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); });

    dmgNumbers.forEach(d => {
      ctx.globalAlpha = Math.min(1, d.life / 0.3);
      ctx.fillStyle = '#000';
      ctx.font = 'bold 10px monospace';
      ctx.fillText(d.val, d.x - 4 + 1, d.y + 1);
      ctx.fillStyle = '#ff004d';
      ctx.fillText(d.val, d.x - 4, d.y);
      ctx.globalAlpha = 1;
    });

    qiqis.forEach(q => {
      const a = Math.atan2(q.vy, q.vx);
      ctx.save();
      ctx.translate(q.x, q.y);
      ctx.rotate(a);
      ctx.imageSmoothingEnabled = false;
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.45;
      ctx.fillStyle = ELEM_COLOR[q.elem];
      ctx.fillRect(-13, -4, 26, 8);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#fff8e0';
      ctx.beginPath();
      ctx.moveTo(13, 0); ctx.lineTo(-8, -2.5); ctx.lineTo(-12, 0); ctx.lineTo(-8, 2.5);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = ELEM_COLOR[q.elem];
      ctx.fillRect(-9, -1, 15, 2);
      ctx.restore();
    });

    pickups.forEach(pk => {
      if (pk.life < 3 && Math.floor(pk.life * 6) % 2 === 0) return;
      const yoff = Math.sin(pk.bob) * 2;
      ctx.fillStyle = '#7d4a2b';
      ctx.fillRect(pk.x - 2, pk.y - 5 + yoff, 4, 3);
      ctx.fillStyle = '#c0392b';
      ctx.fillRect(pk.x - 3, pk.y - 2 + yoff, 6, 7);
      ctx.fillStyle = '#ff5f6d';
      ctx.fillRect(pk.x - 1, pk.y + 1 + yoff, 2, 3);
      ctx.fillStyle = '#fff';
      ctx.fillRect(pk.x - 2, pk.y - 1 + yoff, 1, 1);
    });

    shockwaves.forEach(sw => {
      ctx.strokeStyle = '#e74c3c';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(sw.x, sw.y, sw.r, 0, 7); ctx.stroke();
    });

    enemyProjs.forEach(p => drawEnemyProj(p));

    slashes.forEach(s => {
      const alpha = s.life / 0.15;
      ctx.strokeStyle = ELEM_COLOR[s.elem];
      ctx.globalAlpha = alpha;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.range, s.ang - 1.4, s.ang + 1.4);
      ctx.stroke();
      ctx.globalAlpha = alpha * 0.4;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.range, s.ang - 1.4, s.ang + 1.4);
      ctx.lineTo(s.x, s.y);
      ctx.fill();
      ctx.globalAlpha = 1;
    });

    enemies.forEach(en => {
      let aura = null;
      if (en.fireT > 0) aura = '#e74c3c';
      else if (en.waterT > 0) aura = '#5dade2';
      else if (en.thunderT > 0) aura = '#f4d03f';
      if (aura) {
        ctx.save(); ctx.globalAlpha = 0.28; ctx.fillStyle = aura;
        ctx.beginPath(); ctx.arc(en.x, en.y, en.size + 3, 0, 7); ctx.fill(); ctx.restore();
      }
      if (en.spinT > 0) {
        ctx.strokeStyle = '#c0392b';
        ctx.lineWidth = 2;
        const sp = (en.spinT * 20) % 3;
        ctx.beginPath(); ctx.arc(en.x, en.y, 28 + sp * 2, 0, 7); ctx.stroke();
      }
      if (en.type === 'boss') drawBoss(en);
      else if (en.type === 'elite') drawWalkFrame('shield', en, 1);
      else drawWalkFrame(en.type, en, 1);

      if (en.hp < en.maxhp) {
        const bw = en.size * 2;
        ctx.fillStyle = '#000'; ctx.fillRect(en.x - bw / 2, en.y - en.size - 7, bw, 2);
        ctx.fillStyle = '#c0392b'; ctx.fillRect(en.x - bw / 2, en.y - en.size - 7, bw * Math.max(0, en.hp / en.maxhp), 2);
      }
    });

    if (player) {
      const blink = player.iframes > 0 && Math.floor(time * 20) % 2 === 0;
      ctx.fillStyle = '#fff';
      ctx.fillRect(player.x + Math.cos(mouseAngle) * 15 - 1, player.y + Math.sin(mouseAngle) * 15 - 1, 2, 2);
      drawWalkFrame('hero', player, blink ? 0.4 : 1);
      if (player.shield > 0) {
        ctx.save();
        ctx.strokeStyle = '#5dade2';
        ctx.globalAlpha = 0.85;
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(player.x, player.y, 13, 0, 7); ctx.stroke();
        ctx.restore();
      }
    }

    // virtual joysticks on top
    drawJoystick(moveTouch, '#e8d5a8');
    drawJoystick(aimTouch, '#d4af37');

    if (hurtFlash > 0) {
      ctx.fillStyle = 'rgba(255,0,50,' + (hurtFlash / 0.3 * 0.35) + ')';
      ctx.fillRect(0, 0, worldW, worldH);
    }
    ctx.restore();
  }

  // ================= PUBLIC API =================
  let lastT = Date.now();
  function frame() {
    const now = Date.now();
    let dt = (now - lastT) / 1000;
    lastT = now;
    dt = Math.min(dt, 0.05);
    if (dt > 0.0001) {
      // isolate per-frame errors so a single bad frame never stops the loop
      try { update(dt); } catch (e) { console.error('update error', e); }
      try { render(); } catch (e) { console.error('render error', e); }
    }
  }

  return {
    resize,
    applyBaseTransform,
    frame,
    startRun: (sk) => newRun(sk),
    pickChoose,
    restart: () => newRun('sword_flame'),
    touchStart, touchMove, touchEnd,
    _debug: () => ({
      state,
      player: player ? { x: player.x, y: player.y, hp: player.hp, face: player.face, moving: player.moving } : null,
      enemies: (enemies || []).map(e => ({ x: e.x, y: e.y, hp: e.hp, kind: e.kind, elite: e.elite, boss: e.boss, ranged: e.ranged })),
      pickups: (pickups || []).map(p => ({ x: p.x, y: p.y })),
      roomNum
    }),
    setGod: (on) => { if (player) player.god = on; }
  };
}

// ================= H5 BOOT =================
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
ctx.imageSmoothingEnabled = false;
let engine = null;

function elemColor(elem){
  return {fire:'#e74c3c', water:'#5dade2', thunder:'#f4d03f', wind:'#58d68d'}[elem] || '#c8b890';
}

function makeCard(container, key, cb){
  const d = SKILLS[key];
  const c = document.createElement('div');
  c.className = 'card';
  c.innerHTML = '<h3>'+d.name+'</h3>'+
    '<div class="elem ef" style="color:'+elemColor(d.elem)+'">['+d.elem+'剑意]</div>'+
    '<div class="desc">'+d.desc+'</div>';
  c.addEventListener('pointerdown', function(ev){ ev.preventDefault(); ev.stopPropagation(); cb(key); });
  container.appendChild(c);
}

function showStartCards(){
  const box = document.getElementById('startCards');
  box.innerHTML = '';
  START_POOL.forEach(k => makeCard(box, k, function(key){ engine.startRun(key); }));
}

function showChooseCards(title, cards){
  document.getElementById('chooseTitle').textContent = title;
  const box = document.getElementById('chooseCards');
  box.innerHTML = '';
  cards.forEach(card => makeCard(box, card.key, function(key){ engine.pickChoose(key); }));
  document.getElementById('choose').classList.remove('hidden');
}

function hideOverlays(){
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('choose').classList.add('hidden');
  document.getElementById('end').classList.add('hidden');
}

// load images then boot
const imgs = {};
const ASSET_KEYS = ['walks','boss','lantsi','shapo','bawang','tile1','tile2','tile3','tile4','tile5'];
let loaded = 0;
const total = ASSET_KEYS.length;
ASSET_KEYS.forEach(k => {
  const im = new Image();
  im.onload = () => { imgs[k] = im; loaded++; if (loaded === total) boot(); };
  im.onerror = () => { console.error('asset failed', k); loaded++; if (loaded === total) boot(); };
  im.src = ASSETS[k];
});

function boot(){
  const callbacks = {
    onHud: ({ hpText, dmgMulText }) => {
      document.getElementById('hp').textContent = hpText;
      document.getElementById('dmgMul').textContent = dmgMulText;
    },
    onRoom: ({ roomText, roomLabel }) => {
      document.getElementById('room').textContent = roomText;
      document.getElementById('roomLabel').textContent = roomLabel;
    },
    onRoomStart: () => hideOverlays(),
    onChoose: ({ title, cards }) => showChooseCards(title, cards),
    onEnd: ({ title, text }) => {
      document.getElementById('endTitle').textContent = title;
      document.getElementById('endText').innerHTML = text.split('\n').join('<br>');
      document.getElementById('end').classList.remove('hidden');
    }
  };
  engine = createGameEngine(cvs, ctx, imgs, callbacks);
  showStartCards();
  doResize();
  const loop = () => { engine.frame(); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}

function doResize(){
  if (!engine) return;
  const cssW = window.innerWidth, cssH = window.innerHeight;
  engine.resize(cssW, cssH);
  engine.applyBaseTransform(window.devicePixelRatio || 1);
}
addEventListener('resize', doResize);
addEventListener('orientationchange', () => setTimeout(doResize, 200));

// ---- orientation hint (landscape recommended; portrait allowed) ----
let portraitOverride = false;
function checkOrientation(){
  const portrait = innerHeight > innerWidth;
  const tip = document.getElementById('rotateTip');
  if (portrait && !portraitOverride){
    tip.classList.remove('hidden');
  } else {
    tip.classList.add('hidden');
  }
}
addEventListener('resize', checkOrientation);
addEventListener('orientationchange', () => setTimeout(checkOrientation, 150));
document.getElementById('continuePortrait').addEventListener('pointerdown', function(e){
  e.preventDefault(); e.stopPropagation();
  portraitOverride = true;
  document.getElementById('rotateTip').classList.add('hidden');
});
checkOrientation();

document.getElementById('restartBtn').addEventListener('pointerdown', function(ev){
  ev.preventDefault(); ev.stopPropagation();
  if (engine) engine.restart();
});

// ---- unified pointer -> touch (left half = move, right half = aim; multi-touch ok) ----
const activePointers = new Map();
function toTouchList(){
  return Array.from(activePointers.values()).map(p => ({ identifier: p.id, x: p.x, y: p.y }));
}
function feed(method, changed){
  if (!engine) return;
  const list = changed.map(p => ({ identifier: p.id, x: p.x, y: p.y }));
  engine[method](list);
}
cvs.addEventListener('pointerdown', function(e){
  // ignore presses on overlays (overlays sit above canvas and stop propagation themselves)
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  activePointers.set(e.pointerId, { id: e.pointerId, x: e.clientX, y: e.clientY });
  feed('touchStart', [activePointers.get(e.pointerId)]);
}, { passive:false });
cvs.addEventListener('pointermove', function(e){
  if (!activePointers.has(e.pointerId)) return;
  e.preventDefault();
  activePointers.set(e.pointerId, { id: e.pointerId, x: e.clientX, y: e.clientY });
  feed('touchMove', [activePointers.get(e.pointerId)]);
}, { passive:false });
function endPointer(e){
  if (!activePointers.has(e.pointerId)) return;
  e.preventDefault();
  const p = activePointers.get(e.pointerId);
  activePointers.delete(e.pointerId);
  feed('touchEnd', [p]);
}
cvs.addEventListener('pointerup', endPointer, { passive:false });
cvs.addEventListener('pointercancel', endPointer, { passive:false });
</script>
